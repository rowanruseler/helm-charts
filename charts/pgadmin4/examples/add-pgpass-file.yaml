#
# values.yaml
#

# Use a pgpass file for server connections, so pgAdmin doesn't ask for passwords.
# An init container copies the file into the pod with mode 0600 (libpq ignores
# the file otherwise) and the chart points PGPASSFILE at the copy.
# Ref: https://www.postgresql.org/docs/current/libpq-pgpass.html
pgpass:
  existingSecret: pgpassfile
  key: pgpass

#
# secrets.yaml
#
---
apiVersion: v1
kind: Secret
metadata:
  name: pgpassfile
type: Opaque
stringData:
  # hostname:port:database:username:password
  pgpass: |
    postgres.example.svc:5432:*:postgres:changeme
