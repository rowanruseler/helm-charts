## Chart test configuration
test:
  # -- Enables test
  enabled: true
  # -- [Hook deletion policy](https://helm.sh/docs/topics/charts_hooks/#hook-deletion-policies) for the test Pod. Use `before-hook-creation` to keep the Pod so you can read its logs
  hookDeletePolicy: hook-succeeded
  ## Container image for test-connection.yaml
  image:
    # -- Docker image registry for test
    registry: docker.io
    # -- Docker image for test
    repository: busybox
    # -- Docker image tag for test
    tag: "1.38.0"
  ## Resources request/limit for test-connection Pod
  # -- CPU/memory resource requests/limits for test
  resources: {}
    # limits:
    #   cpu: 50m
    #   memory: 32Mi
    # requests:
    #   cpu: 25m
    #   memory: 16Mi
  ## Security context for test-connection Pod
  # -- Custom [security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) for test Pod
  # @default -- ``
  securityContext:
    runAsUser: 5051
    runAsGroup: 5051
    fsGroup: 5051

  ## Container Security context for test-connection Pod
  # -- Custom [pod security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) for test pod
  # @default -- `{readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, seccompProfile: {type: RuntimeDefault}}`
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
