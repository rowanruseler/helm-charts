## Persistent volume configuration
persistentVolume:
  ## If true, pgAdmin4 will create/use a Persistent Volume Claim
  ## If false, use emptyDir
  # -- If true, pgAdmin4 will create a Persistent Volume Claim
  enabled: true

  ## pgAdmin4 Persistent Volume Claim annotations
  # -- Persistent Volume Claim annotations
  annotations: {}

  ## pgAdmin4 Persistent Volume access modes
  ## Must match those of existing PV or dynamic provisioner
  ## Ref: http://kubernetes.io/docs/user-guide/persistent-volumes/
  # -- Persistent Volume access modes
  # @default -- `[ReadWriteOnce]`
  accessModes:
    - ReadWriteOnce

  ## pgAdmin4 Persistent Volume Size
  # -- Persistent Volume size
  size: 10Gi

  ## pgAdmin4 Persistent Volume Storage Class
  ## If defined, storageClassName: <storageClass>
  ## If set to "-", storageClassName: "", which disables dynamic provisioning
  ## If undefined (the default) or set to null, no storageClassName spec is
  ## set, choosing the default provisioner (gp2 on AWS, standard on GKE, AWS & OpenStack)
  # -- Persistent Volume Storage Class. `-` sets an empty storageClassName; empty uses the cluster default
  storageClass: ""
  # -- Persistent Volume existing claim name
  existingClaim: ""

  ## Subdirectory of pgAdmin4 Persistent Volume to mount
  ## Useful if the volume's root directory is not empty
  # -- Subdirectory of the volume to mount at
  subPath: ""

## Additional volumes to be added to the deployment
# -- Additional volumes for the pgadmin4 pod
extraVolumes: []

## Security context to be added to pgAdmin4 pods
# -- Custom [pod security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) for pgAdmin4 pod
# @default -- ``
securityContext:
  runAsUser: 5050
  runAsGroup: 5050
  fsGroup: 5050

## Container security context
## See the README "Hardening" section for restricted Pod Security settings
# -- Custom [security context](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) for pgAdmin4 container
# @default -- ``
containerSecurityContext:
  enabled: false
  allowPrivilegeEscalation: false

## pgAdmin4 health check probe configuration
## Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# -- [liveness probe](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/) initial delay and timeout
# @default -- ``
livenessProbe:
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

# -- [readiness probe](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/) initial delay and timeout
# @default -- ``
readinessProbe:
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# -- [startup probe](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/) initial delay and timeout
# @default -- ``
startupProbe:
  failureThreshold: 18
  periodSeconds: 10

## Required to be enabled pre pgAdmin4 4.16 release, to set the ACL on /var/lib/pgadmin
## Ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
VolumePermissions:
  ## If true, enables an InitContainer to set permissions on /var/lib/pgadmin
  # -- Enables init container that changes volume permissions in the data directory
  enabled: false

## List of extra manifests to deploy
# -- List of extra manifests to deploy
extraDeploy: []

## Additional InitContainers to initialize the pod
# -- Sidecar init containers to add to the pgadmin4 pod
extraInitContainers: |
