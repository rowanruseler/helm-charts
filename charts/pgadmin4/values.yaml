## Global image configuration
global:
  ## Overrides the Docker registry globally for all images
  # -- Global image pull registry for all images
  imageRegistry: ""
  ## Add additional image pull secrets globally
  ## Support both full format (- name: secret) and short format (- secret)
  ## These will be merged with any chart-specific pull secrets
  # -- Global image pull secrets, support both full format (- name: secret) and short format (- secret)
  imagePullSecrets: []

## Override the chart name used in resource names and labels
# -- Override the chart name used in resource names and labels
nameOverride: ""

## Override the full resource name
# -- Override the full resource name
fullnameOverride: ""

## Workload type - Deployment or StatefulSet
## StatefulSet is useful for stable storage and network identity
## When using StatefulSet, PVCs are managed via volumeClaimTemplates
workload:
  ## Kind can be either "Deployment" or "StatefulSet"
  # -- Workload type (Deployment or StatefulSet)
  kind: Deployment

## Number of pgAdmin4 replicas
# -- Number of pgadmin4 replicas
replicaCount: 1

## pgAdmin4 container image
image:
  # -- Docker image registry
  registry: docker.io
  # -- Docker image
  repository: dpage/pgadmin4
  ## Overrides the image tag whose default is the chart appVersion
  # -- Docker image tag
  tag: ""
  # -- Docker image pull policy
  pullPolicy: IfNotPresent

## Optionally specify an array of imagePullSecrets
## Secrets must be manually created in the namespace
## Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
# -- Docker image pull secrets
imagePullSecrets: []
  # - RegistryKeySecret

## Deployment annotations
# -- Deployment Annotations
annotations: {}

## The number of old history to retain to allow rollback
# -- The number of old history to retain to allow rollback
revisionHistoryLimit: 10

## Add labels to all the deployed resources
# -- Add labels to all the deployed resources
commonLabels: {}

## Priority class name for pod scheduling
# -- Deployment priorityClassName
priorityClassName: ""

## Deployment entrypoint override
## Useful when there's a requirement to modify container's default
## Ref: https://www.vaultproject.io/docs/platform/k8s/injector/examples#environment-variable-example
## Ref: https://github.com/postgres/pgadmin4/blob/master/Dockerfile#L206
# command: ["/bin/sh", "-c", "source /vault/secrets/config && <entrypoint script>"]
# -- Container command override
command: []

## Deployment arguments override
# -- Deployment arguments override
args: []

## Service configuration
service:
  # -- Service type (ClusterIP, NodePort or LoadBalancer)
  type: ClusterIP
  # -- Service type Cluster IP
  clusterIP: ""
  # -- Service Load Balancer IP
  loadBalancerIP: ""
  # -- Service port
  port: 80
  ## Defaults to the container port named by portName, which follows containerPorts.http
  # -- Container port the Service targets, a number or a port name. Empty means the port named `service.portName`
  targetPort: ""
  # targetPort: 4181  # To be used with a proxy extraContainer
  # -- Name of the port on the service
  portName: http

  ## Special annotations at the service level, e.g.
  ## this will set vnet internal IPs rather than public IPs
  ## service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  # -- Service Annotations
  annotations: {}

  ## Specify the nodePort value for the service types
  ## Ref: https://kubernetes.io/docs/concepts/services-networking/service/#type-nodeport
  # -- Kubernetes service nodePort
  nodePort: null

## Pod Service Account
## Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
serviceAccount:
  ## Specifies whether a service account should be created
  # -- Creates a ServiceAccount for the pod.
  create: false
  ## Annotations to add to the service account
  # -- Annotations to add to the service account.
  annotations: {}
  ## The name of the service account to use
  ## If not set and create is true, a name is generated using the fullname template
  # -- The name of the service account. Otherwise uses the fullname.
  name: ""
  ## Opt out of API credential automounting
  ## If you don't want the kubelet to automatically mount a ServiceAccount's API credentials,
  ## you can opt out of the default behavior
  # -- Opt out of API credential automounting.
  automountServiceAccountToken: false

## Pod HostAliases
## Ref: https://kubernetes.io/docs/tasks/network/customize-hosts-file-for-pods/
# -- Add entries to Pod /etc/hosts
hostAliases: []
  # - ip: "127.0.0.1"
  #   hostnames:
  #   - "pgadmin4.local"

## Strategy used to replace old Pods by new ones
## Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
# -- Specifies the strategy used to replace old Pods by new ones
strategy: {}
  # type: RollingUpdate
  # rollingUpdate:
  #   maxSurge: 0
  #   maxUnavailable: 1

## Pre-load pgAdmin4 with servers at first start-up
## Servers are imported only the first time the config DB is created
## Ref: https://www.pgadmin.org/docs/pgadmin4/latest/import_export_servers.html
serverDefinitions:
  ## Enable/disable server import
  # -- Enables Server Definitions
  enabled: false

  ## Storage for the server JSON:
  ##   ConfigMap - plain text (good for non-secret data)
  ##   Secret    - base-64 (better for credentials)
  # -- The type of resource to deploy server definitions (either `ConfigMap` or `Secret`)
  resourceType: ConfigMap

  ## Use this only when `resourceType` = ConfigMap - point to an existing ConfigMap
  ## that already holds your `servers.json`
  # -- The name of a configMap containing Server Definitions. Only used when `serverDefinitions.resourceType` is `ConfigMap`
  existingConfigmap: ""

  ## Use this only when `resourceType` = Secret - point to an existing Secret
  ## that already holds your `servers.json`
  # -- The name of a Secret containing Server Definitions. Only used when `serverDefinitions.resourceType` is `Secret`
  existingSecret: ""

  ## Set to true to put raw JSON under `stringData` (handy for dry-runs/debug)
  ## Leave false to keep the default base-64 in `data`
  # -- When `resourceType` = `Secret` put raw JSON under `stringData:` instead of base-64 under `data:`. Useful for debugging
  useStringData: false

  ## Annotations for ConfigMap or Secret, if you are not using existing resources
  # -- Annotations for ConfigMap or Secret, if you are not using existing resources. Useful for cluster webhooks
  annotations: {}
    # vault.security.example.io/vault-role: my-role

  ## Inline server definitions (ignore if you point to an existing resource)
  ## You can use Helm templates here, e.g. Host: "{{ .Values.example.host }}"
  # -- Pre-configured server parameters
  servers:
  #  firstServer:
  #    Name: "Minimally Defined Server"
  #    Group: "Servers"
  #    Username: "postgres"
  #    Host: "{{ .Values.example.host }}"
  #    Port: "{{ .Values.example.port }}"
  #    SSLMode: "prefer"
  #    MaintenanceDB: "postgres"

## Pre-load pgAdmin4 with user preferences
## This mounts a preferences.json file to override default UI settings such as themes,
## display options, or query tool behavior
## Ref: https://www.pgadmin.org/docs/pgadmin4/latest/preferences.html
preferences:
  ## Enable/disable preferences
  # -- Specify if to create preferences configmap and mount it
  enabled: false

  ## If using an existing ConfigMap, it must contain a key named `preferences.json`
  # -- The name of a configMap containing your Preferences
  existingConfigMap: ""

  # -- Preferences Data
  data: {}
  #  misc:user_interface:theme: dark

## Network policy configuration
networkPolicy:
  # -- Enables Network Policy
  enabled: true

## PodDisruptionBudget for voluntary disruptions such as node drains
## With a single replica, minAvailable: 1 blocks drains until you scale up
## Ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
podDisruptionBudget:
  # -- Creates a PodDisruptionBudget
  enabled: false
  # -- Pods that must stay available during voluntary disruptions
  minAvailable: 1
  ## Takes precedence over minAvailable when set
  # -- Pods that may be unavailable at once. Takes precedence over `minAvailable`
  maxUnavailable: null

## HTTP route configuration
httpRoute:
  # -- Switches from standard Ingress to Gateway API HTTPRoute resource generation
  enabled: false
  # -- Additional labels to add to the generated HTTPRoute resource metadata.
  labels: {}
  # -- Key-value map for controller-specific metadata
  annotations: {}
  # -- FQDNs for Layer 7 matching. If empty, matches all hostnames on the parent Gateway listener
  hostnames: []
  # -- Binds this route to specific Gateway resources (name/namespace), enabling the data plane attachment
  parentRefs: []
  # -- Core routing rules (path/headers) and backendRefs; evaluated in order until a match occurs
  matches: []

## Ingress configuration
## Ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  # -- Enables Ingress
  enabled: false
  ## For Kubernetes >= 1.18 you should specify the ingress-controller via the field ingressClassName
  ## Ref: https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#specifying-the-class-of-an-ingress
  # -- Ingress Class Name, e.g. `nginx`
  ingressClassName: ""
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Custom labels
  labels: {}
  # -- Ingress hosts, each with a `host` and a list of `paths` (`path`, `pathType`)
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

## Istio ingress configuration
## Use Istio Gateway and VirtualService instead of Ingress
istioIngress:
  # -- Enable Istio Gateway instead of Ingress
  enabled: false

  ## The label selector for your existing Istio Ingress Gateway pods
  ## This tells the Gateway resource which gateway deployment to attach to
  ## Example: "ingressgateway" is a common default label
  # -- Label selector for Istio Ingress Gateway pods
  selector: ""

  ## A list of hostnames this Gateway will manage
  # -- Hosts served by Istio Gateway
  # @default -- `[""]`
  endpoints:
    - "test.example.com"

  ## TLS configuration for Istio Gateway
  tls:
    # -- Enable TLS for Istio gateway
    enabled: false
    ## The name of the K8s Secret containing the cert
    ## Istio's Gateway resource will reference this name in its credentialName field
    ## Should be in istio-ingress namespace where istio ingress gateway is installed
    # -- TLS certificate secret name
    secretCertName: "my-istio-tls-secret"

  ## Defines the ports on the Istio Ingress Gateway
  gateway:
    # -- Enable Istio Gateway resource
    enabled: false
    # -- Istio gateway ports configuration
    # @default -- `{http: {...}, https: {...}}`
    ports:
      http:
        number: 80
        protocol: HTTP
        ## If true, the template generates a rule to redirect HTTP->HTTPS
        isTlsRedirect: true
        isTlsTermination: false
      https:
        number: 443
        protocol: HTTPS
        isTlsRedirect: false
        ## If true, the gateway terminates TLS (handles HTTPS)
        isTlsTermination: true
        ## SIMPLE: Standard TLS, MUTUAL: mTLS, PASSTHROUGH: Send TLS to pod
        tlsMode: SIMPLE

  ## Istio VirtualService configuration
  ## The VirtualService defines how traffic is routed after it enters the Gateway
  virtualService:
    # -- Enable Istio VirtualService
    enabled: false
    # -- VirtualService gateway name
    gateway: ""
    # -- VirtualService routing config
    # @default -- `{}`
    config:
      ## http is a list of ordered routing rules. First match wins
      http:
      - name: "pgadmin-route"
        match:
        - uri:
            prefix: "/"
        route:
        - destination:
            ## Defaults to the chart Service: <fullname>.<namespace>.svc.cluster.local
            # host: ""
            portNumber: 80
          weight: 100
        rewrite:
          uri: "/"
        corsPolicy:
          allowOrigins:
            - exact: "*"
          allowHeaders:
          - "*"
          allowMethods:
          - "*"
          exposeHeaders:
          - "*"
          maxAge: "24h"

## Additional config maps to be mounted inside a container
## Can be used to map config maps for sidecar as well
# -- Additional configMap volume mounts for pgadmin4 pod
extraConfigmapMounts: []
  # - name: certs-configmap
  #   mountPath: /etc/ssl/certs
  #   subPath: ""
  #   configMap: certs-configmap
  #   readOnly: true

## pgpass file for database connections, read from an existing Secret
## An init container copies it into the pod with mode 0600, which libpq requires
## and a Secret mount can't provide, and the chart sets PGPASSFILE to the copy
## unless env.pgpassfile is set
pgpass:
  # -- Existing Secret with a pgpass file. An init container copies it into the pod with mode 0600 and the chart sets `PGPASSFILE`, unless `env.pgpassfile` is set
  existingSecret: ""
  # -- Key in `pgpass.existingSecret` that holds the pgpass file
  key: pgpass

## Additional secret mounts to be mounted inside a container
# -- Additional secret volume mounts for pgadmin4 pod
extraSecretMounts: []
  # - name: pgpassfile
  #   secret: pgpassfile
  #   subPath: pgpassfile
  #   mountPath: "/var/lib/pgadmin/storage/pgadmin/file.pgpass"
  #   readOnly: true

## Additional volumes to be mounted inside a container
# -- Additional volume mounts for the pgadmin4 container
extraVolumeMounts: []

## Specify additional containers in extraContainers
## For example, to add an authentication proxy to a pgadmin4 pod
# -- Sidecar containers to add to the pgadmin4 pod
extraContainers: |
# - name: proxy
#   image: quay.io/gambol99/keycloak-proxy:latest
#   args:
#   - -provider=github
#   - -client-id=
#   - -client-secret=
#   - -github-org=<ORG_NAME>
#   - -email-domain=*
#   - -cookie-secret=
#   - -http-address=http://0.0.0.0:4181
#   - -upstream-url=http://127.0.0.1:3000
#   ports:
#     - name: proxy-web
#       containerPort: 4181

## Name of existing secret to use for default pgadmin credentials
## env.password will be ignored and picked up from this secret
# -- The name of an existing secret containing the pgadmin4 default password and, optionally, Server Definitions.
existingSecret: ""

## Name of key in existing secret to use for default pgadmin credentials
## Only used when existingSecret is set
secretKeys:
  # -- Name of key in existing secret to use for default pgadmin credentials. Only used when `existingSecret` is set.
  pgadminPasswordKey: password

## pgAdmin4 startup configuration
## Values in here get injected as environment variables
## Chart reinstall needed to apply changes
env:
  ## Can be email or nickname
  # -- pgAdmin4 default email. Needed chart reinstall for apply changes
  email: chart@domain.com
  # -- pgAdmin4 default password. Needed chart reinstall for apply changes
  password: SuperSecret
  # -- Path to a pgpass file, e.g. `/var/lib/pgadmin/storage/pgadmin/file.pgpass`. Defaults to `/pgpass/pgpass` when `pgpass.existingSecret` is set
  pgpassfile: ""

  ## Set context path for application (e.g. /pgadmin4/*)
  # -- Context path for serving pgAdmin under a URL prefix, e.g. `/pgadmin4`
  contextPath: ""

  ## If True, allows pgAdmin4 to create session cookies based on IP address
  ## Ref: https://www.pgadmin.org/docs/pgadmin4/latest/config_py.html
  # -- Allows pgAdmin4 to create session cookies based on IP address
  enhanced_cookie_protection: "False"

  ## Add custom environment variables that will be injected to deployment
  ## Ref: https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html
  # -- Additional environment variables as a list of `name`/`value` pairs
  variables: []
  # - name: PGADMIN_LISTEN_ADDRESS
  #   value: "0.0.0.0"
  # - name: PGADMIN_LISTEN_PORT
  #   value: "8080"

## Additional environment variables from ConfigMaps
# -- Array of ConfigMap names to load as environment variables
envVarsFromConfigMaps: []
  # - array-of
  # - config-map-names

## Additional environment variables from Secrets
# -- Array of Secret names to load as environment variables
envVarsFromSecrets: []
  # - array-of
  # - secret-names

## Additional environment variables
# -- Array of arbitrary environment variable definitions (e.g., for fetching from Kubernetes Secrets)
envVarsExtra: []
