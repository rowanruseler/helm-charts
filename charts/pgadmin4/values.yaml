  http: 80

## Resource limits and requests
## We usually recommend not to specify default resources and to leave this as a conscious
## choice for the user. This also increases chances charts run on environments with little
## resources, such as Minikube. If you do want to specify resources, uncomment the following
## lines, adjust them as necessary, and remove the curly braces after 'resources:'
## You might also want to increase failure threshold value in startup probe configuration to
## allow the container to start successfully on CPU limited environments
# -- CPU/memory resource requests/limits
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

## Horizontal Pod Autoscaling
## Ref: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
autoscaling:
  # -- Enables Autoscaling
  enabled: false
  # -- Minimum amount of Replicas
  minReplicas: 1
  # -- Maximum amount of Replicas
  maxReplicas: 100
  # -- Target CPU Utilization in percentage
  targetCPUUtilizationPercentage: 80
  # -- Target Memory Utilization in percentage, e.g. `80`
  targetMemoryUtilizationPercentage: null
  ## Scaling policies and stabilization windows (autoscaling/v2 spec.behavior)
  ## Ref: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/#configurable-scaling-behavior
  # -- HPA scaling policies and stabilization windows (`spec.behavior`)
  behavior: {}
  #   scaleDown:
  #     stabilizationWindowSeconds: 600

