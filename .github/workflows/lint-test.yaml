# Documentation
# https://github.com/helm/chart-testing-action
name: Lint and Test Charts
on: pull_request

# Prevent concurrent runs of the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Set explicit permissions
permissions:
  contents: read
  packages: read

jobs:
  lint-test:
    name: lint-test (helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        helm: [v3.22.0, v4.3.0]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch and create local main branch
        run: |
          git fetch origin main
          git branch main origin/main

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}

      # Installed from the release tarball: Helm 4 can't verify a git install.
      - name: Install helm-unittest
        env:
          VERSION: 1.1.2
          SHA256: f3f6e4bcfbb73bf573434444af4ea506caaeb6f71dbb9891b499758574dd3161
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/helm-unittest/helm-unittest/releases/download/v${VERSION}/unittest-${VERSION}.tgz"
          echo "${SHA256}  unittest-${VERSION}.tgz" | sha256sum -c -
          mkdir -p helm-unittest "$(helm env HELM_PLUGINS)"
          tar -xzf "unittest-${VERSION}.tgz" -C helm-unittest
          helm plugin install "$RUNNER_TEMP/helm-unittest/unittest"

      - name: Run helm-unittest
        run: helm unittest charts/*

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      # ct only tests changed charts. When the CI setup itself changes, test all
      # charts so the change is exercised before it merges.
      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          if [[ -n "$(ct list-changed --config ct.yaml)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet origin/main...HEAD -- ct.yaml kind-config.yaml .github/workflows/lint-test.yaml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "all=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        env:
          ALL: ${{ steps.list-changed.outputs.all }}
        run: |
          args=(--config ct.yaml)
          if [[ "$ALL" == true ]]; then
            args+=(--all --check-version-increment=false)
          fi
          ct lint "${args[@]}"

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          config: kind-config.yaml
          cluster_name: "pgadmin4"

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        env:
          ALL: ${{ steps.list-changed.outputs.all }}
        run: |
          args=(--config ct.yaml)
          if [[ "$ALL" == true ]]; then
            args+=(--all)
          fi
          ct install "${args[@]}"
