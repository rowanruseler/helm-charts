name: "Publish charts to repo"
on:
  push:
    branches:
    - main

jobs:
  publish:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - name: Install Helm
      uses: azure/setup-helm@v5.0.1

    - name: Run chart-releaser
      uses: helm/chart-releaser-action@v1.7.0
      with:
        config: .github/cr.yaml
      env:
        CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

    # chart-releaser leaves the charts it released in .cr-release-packages.
    - name: Push charts to ghcr.io
      if: hashFiles('.cr-release-packages/*.tgz') != ''
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        for pkg in .cr-release-packages/*.tgz; do
          helm push "$pkg" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
        done
